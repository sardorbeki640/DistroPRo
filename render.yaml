services:
  - type: web
    name: distropro
    runtime: node
    plan: free
    repo: https://github.com/sardorbeki640/DistroPRo.git
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@11.25.0 --activate && pnpm install --frozen-lockfile && pnpm run build
    # Dependencies are installed during build; start Node directly to avoid a Corepack download on every restart.
    startCommand: node --env-file-if-exists=.env.local dist/server.cjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: FINANCE_DATA_DIR
        value: .data
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OWNER_SETUP_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
